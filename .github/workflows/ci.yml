name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  python-tests-and-dbt-parse:
    name: Python tests and dbt parse
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pandas requests sqlalchemy psycopg2-binary dbt-postgres

      - name: Run Python tests
        run: |
          python -m pytest

      - name: Create dbt profile for CI parse
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          dbt_retail_analytics:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                user: ci_user
                password: ci_password
                port: 5432
                dbname: retail_analytics
                schema: dbt
                threads: 1
          EOF

      - name: Run dbt parse
        working-directory: dbt_retail_analytics
        run: |
          dbt parse