version: 2

sources:
  - name: raw
    database: retail_analytics
    schema: raw
    description: >
      Raw PostgreSQL landing schema. These tables are loaded from cleaned and
      validated local files by the Python loading pipeline. The raw schema is
      the database landing layer and is tracked through audit.load_audit.

    tables:
      - name: olist_customers
        description: Customer identity and geography data from the Olist source.
        columns:
          - name: customer_id
            description: Customer identifier used in the orders table.
            data_tests:
              - not_null
              - unique
          - name: customer_unique_id
            description: Unique customer identity across orders.
          - name: customer_zip_code_prefix
            description: Customer zip code prefix.
          - name: customer_city
            description: Customer city.
          - name: customer_state
            description: Customer state.

      - name: olist_geolocation
        description: Zip-code level geolocation reference data from Olist.
        columns:
          - name: geolocation_zip_code_prefix
            description: Zip code prefix for geolocation records.
          - name: geolocation_lat
            description: Latitude.
          - name: geolocation_lng
            description: Longitude.
          - name: geolocation_city
            description: City name.
          - name: geolocation_state
            description: State abbreviation.

      - name: olist_orders
        description: Order lifecycle table including customer relationship and timestamps.
        columns:
          - name: order_id
            description: Unique order identifier.
            data_tests:
              - not_null
              - unique
          - name: customer_id
            description: Customer identifier linked to olist_customers.
            data_tests:
              - not_null
          - name: order_status
            description: Current order lifecycle status.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - delivered
                      - shipped
                      - canceled
                      - unavailable
                      - invoiced
                      - processing
                      - created
                      - approved
          - name: order_purchase_timestamp
            description: Timestamp when the order was purchased.
          - name: order_approved_at
            description: Timestamp when the order was approved.
          - name: order_delivered_carrier_date
            description: Timestamp when the order was delivered to the carrier.
          - name: order_delivered_customer_date
            description: Timestamp when the order was delivered to the customer.
          - name: order_estimated_delivery_date
            description: Estimated delivery timestamp.

      - name: olist_order_items
        description: Item-level order table with product, seller, price, and freight data.
        columns:
          - name: order_id
            description: Order identifier.
            data_tests:
              - not_null
          - name: order_item_id
            description: Item sequence number within an order.
            data_tests:
              - not_null
          - name: product_id
            description: Product identifier.
            data_tests:
              - not_null
          - name: seller_id
            description: Seller identifier.
            data_tests:
              - not_null
          - name: shipping_limit_date
            description: Seller shipping deadline.
          - name: price
            description: Item price.
          - name: freight_value
            description: Freight value for the item.

      - name: olist_order_payments
        description: Payment records for Olist orders.
        columns:
          - name: order_id
            description: Order identifier.
            data_tests:
              - not_null
          - name: payment_sequential
            description: Payment sequence number for the order.
          - name: payment_type
            description: Payment method.
            data_tests:
              - accepted_values:
                  arguments:
                    values:
                      - credit_card
                      - boleto
                      - voucher
                      - debit_card
                      - not_defined
          - name: payment_installments
            description: Number of payment installments.
          - name: payment_value
            description: Payment value.

      
      - name: olist_products
        description: Product attributes and product category data.
        columns:
          - name: product_id
            description: Product identifier.
            data_tests:
              - not_null
              - unique
          - name: product_category_name
            description: Original product category name in Portuguese.
          - name: product_name_lenght
            description: Product name length field from the source. Original spelling preserved.
          - name: product_description_lenght
            description: Product description length field from the source. Original spelling preserved.
          - name: product_photos_qty
            description: Number of product photos.
          - name: product_weight_g
            description: Product weight in grams.
          - name: product_length_cm
            description: Product length in centimeters.
          - name: product_height_cm
            description: Product height in centimeters.
          - name: product_width_cm
            description: Product width in centimeters.

      - name: olist_sellers
        description: Seller identity and geography data.
        columns:
          - name: seller_id
            description: Seller identifier.
            data_tests:
              - not_null
              - unique
          - name: seller_zip_code_prefix
            description: Seller zip code prefix.
          - name: seller_city
            description: Seller city.
          - name: seller_state
            description: Seller state.

      - name: product_category_translation
        description: Translation table for product category names.
        columns:
          - name: product_category_name
            description: Original product category name.
            data_tests:
              - not_null
              - unique
          - name: product_category_name_english
            description: English product category name.
            data_tests:
              - not_null

      - name: supplier_product_updates
        description: >
          Cleaned supplier product update source loaded into PostgreSQL. This source
          simulates a messy business file and preserves quality flags for review.
        columns:
          - name: supplier_id
            description: Supplier identifier.
            data_tests:
              - not_null
          - name: supplier_name
            description: Supplier name.
          - name: product_id
            description: Product identifier. Can be missing because this source intentionally contains quality issues.
          - name: supplier_product_code
            description: Supplier-specific product code.
          - name: updated_price_clean
            description: Cleaned supplier price.
          - name: currency_clean
            description: Cleaned currency value.
          - name: stock_status_clean
            description: Cleaned stock status.
          - name: valid_from_clean
            description: Cleaned validity start date.
          - name: last_updated_at_clean
            description: Cleaned supplier update timestamp.
          - name: has_missing_product_id
            description: Flag showing whether product_id is missing.
          - name: has_missing_currency
            description: Flag showing whether currency is missing.
          - name: has_invalid_price
            description: Flag showing whether price could not be parsed.
          - name: has_negative_price
            description: Flag showing whether price is negative.
          - name: has_unknown_stock_status
            description: Flag showing whether stock status is outside accepted values.
          - name: is_duplicate_business_key
            description: Flag showing duplicate supplier business key rows.

      - name: olist_order_reviews
        description: >
          Staging model for Olist order reviews. This model casts review score and
          timestamps and preserves review comments and source metadata.

        columns:
          - name: review_id
            description: Review identifier.
            data_tests:
              - not_null

          - name: order_id
            description: Order identifier linked to stg_orders.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: ref('stg_orders')
                    field: order_id

          - name: review_score
            description: Review score from 1 to 5.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [1, 2, 3, 4, 5]

          - name: review_comment_title
            description: Optional review title.

          - name: review_comment_message
            description: Optional review comment message.

          - name: review_creation_date
            description: Review creation timestamp.

          - name: review_answer_timestamp
            description: Review answer timestamp.

          - name: source_file_name
            description: Original cleaned source file loaded into PostgreSQL.

          - name: ingested_at
            description: Timestamp when the cleaned file was generated or ingested.

          - name: run_date
            description: Logical pipeline run date.


     